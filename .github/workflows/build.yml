name: build

# Every push and pull request builds and tests the package on amd64 and
# arm64. A tag `v<version>` additionally publishes the .debs as a GitHub
# Release and asks apt.arki05.com to index them.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:trixie
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Prepare container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl nodejs

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get install -y --no-install-recommends \
            build-essential pkg-config debhelper devscripts fakeroot dpkg-dev lintian

      # rustup rather than Debian's rustc: the crate follows current stable.
      # debian/control's Build-Depends names Debian's cargo and rustc, which
      # dpkg-buildpackage checks for; installing them satisfies the check
      # while PATH puts rustup's toolchain first.
      - name: Install rust toolchain
        run: |
          apt-get install -y --no-install-recommends cargo rustc
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # debhelper runs the build with HOME pointed at a scratch directory,
          # so the rustup shims would not find the toolchain under ~/.rustup
          # without being told where it is.
          echo "RUSTUP_HOME=$HOME/.rustup" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$HOME/.cargo" >> "$GITHUB_ENV"
          "$HOME/.cargo/bin/rustup" component add clippy rustfmt

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.arch }}-

      - name: Format, clippy and tests
        run: make check

      - name: Build .deb package
        run: make deb

      - name: Collect
        run: |
          mkdir -p dist
          cp -v ../*.deb dist/
          ls -l dist/

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          path: dist
          merge-multiple: true

      - name: The tag is the package version
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends dpkg-dev
          want="${GITHUB_REF_NAME#v}"
          have="$(dpkg-parsechangelog -l debian/changelog -S Version)"
          have="${have%-*}"
          if [ "$want" != "$have" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match debian/changelog version $have"
            exit 1
          fi

      # Published files are immutable: apt.arki05.com records the hash of
      # every .deb it has published and fails its run if one changes, so a
      # file name that exists in an earlier release is never uploaded again.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          published=$(gh release list --limit 200 --json tagName -q '.[].tagName' \
            | xargs -r -I{} gh release view {} --json assets -q '.assets[].name' | sort -u)
          upload=()
          for f in dist/*.deb; do
            name=$(basename "$f")
            if grep -qxF "$name" <<<"$published"; then
              echo "already published, skipping: $name"
            else
              upload+=("$f")
            fi
          done
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
          if [ ${#upload[@]} -gt 0 ]; then
            gh release upload "$GITHUB_REF_NAME" "${upload[@]}"
          fi
          gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name'

      - name: Trigger apt repository publish
        env:
          DISPATCH_TOKEN: ${{ secrets.APT_REPO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "APT_REPO_DISPATCH_TOKEN is not set; the nightly run will pick the release up."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/arki05/apt.arki05.com/actions/workflows/publish.yml/dispatches \
            -d '{"ref":"main"}'
          echo "dispatched"
